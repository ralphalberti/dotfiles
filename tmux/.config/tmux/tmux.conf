# -----------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------

# Use vi-style keys in copy mode
set -g mode-keys vi

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Keep window numbers contiguous after closing a window
set -g renumber-windows on

# Disable mouse support
set -g mouse off

# Use zsh as the default shell
set -g default-shell "$SHELL"

# Improve recognition of modified keys
set -g xterm-keys on

# -----------------------------------------------------------------------------
# Panes and copy mode
# -----------------------------------------------------------------------------

# Make the active pane easy to identify
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=cyan

# Use the Dracula purple for choose-tree preview borders
set -gw tree-mode-border-style "bg=default,fg=#6272a4"

# Use the Tokyo Dracula orange for copy-mode highlighting
set -g mode-style "bg=#d98b5f,fg=#282a36,bold"

# -----------------------------------------------------------------------------
# Status bar - Tokyo Dracula
# -----------------------------------------------------------------------------

# Keep the status bar at the bottom
set -g status-position bottom

# Dracula purple background with light foreground
set -g status-style "bg=#6272a4,fg=#f8f8f2"

# Normal windows inherit the purple status bar
set -g window-status-style "bg=#6272a4,fg=#f8f8f2"

# Highlight the active window with muted orange
set -g window-status-current-style "bg=#d98b5f,fg=#282a36,bold"

# Show prefix state, time, and date on the right
set -g status-right '#{?client_prefix,#[reverse] PREFIX #[default],} %H:%M %d-%b-%y'
